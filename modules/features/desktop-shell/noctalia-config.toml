[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "on_primary"
capsule_fill = "surface"
capsule_opacity = 0.79999998211860657
capsule_padding = 16.0
capsule_radius = 8
capsule_thickness = 0.99999998137354851
end = ["media", "tray", "group:g1"]
margin_edge = 8
margin_ends = 256
padding = 16
position = "right"
start = ["workspaces"]
thickness = 36
widget_spacing = 16

[[bar.default.capsule_group]]
fill = "surface"
id = "g1"
members = ["notifications", "clipboard", "control-center"]
opacity = 1.0
padding = 16.0

[bar.default.monitor.Secondary]
position = "bottom"

[calendar]
enabled = true

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-2", "lockscreen-login-box@HDMI-A-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 70.0
box_width = 400.0
cx = 2560.0
cy = 2041.0
output = "DP-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
box_height = 70.0
box_width = 400.0
cx = 540.0
cy = 1801.0
output = "HDMI-A-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[notification]
background_opacity = 0.79999998211860657
offset_y = 48
position = "bottom_center"

[osd]
offset_y = 48
position = "bottom_center"

[shell]
font_family = "Inter Variable"
settings_show_advanced = true
time_format = "{:%I:%M %p}"
ui_scale = 1.1000000089406967

[shell.launcher]
app_grid = true

[shell.panel]
clipboard_placement = "attached"
session_placement = "floating"
session_position = "center"
transparency_mode = "glass"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = false
shortcut = "5"
variant = "destructive"

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory_dark = "/home/wendy/Projects/nix/resources/wallpapers/dark"
directory_light = "/home/wendy/Projects/nix/resources/wallpapers/light"
fill_mode = "stretch"

[weather]
unit = "imperial"

[widget.clock]
color = "secondary"
format = "{:%H:%M %p}"
vertical_format = "{:%a}\\n{:%b}\\n{:%d}\\n\\n{:%I}\\n{:%M %p}"

[widget.workspaces]
display = "none"
