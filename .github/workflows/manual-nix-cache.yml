name: Manually build and cache Nix targets

on:
  push:
    branches: architecture
  workflow_dispatch:
    inputs:
      bambu_studio:
        description: Build Bambu Studio from Odin's overlaid package set
        type: boolean
        default: false
      llama_cpp:
        description: Build Odin's CUDA llama.cpp service package
        type: boolean
        default: false
      entire_host:
        description: Build the entire Odin NixOS system
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Require at least one target
        if: ${{ !inputs.bambu_studio && !inputs.llama_cpp && !inputs.entire_host }}
        run: |
          echo "Select at least one build target when dispatching the workflow."
          exit 1

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v16
        with:
          name: illusaen
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Bambu Studio
        if: ${{ inputs.bambu_studio }}
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              configs = api.libs.evalLib.mkNixosConfigurations { inherit (api) fleet; };
            in
              builtins.head (
                builtins.filter
                  (pkg: (pkg.pname or "") == "bambu-studio")
                  configs.odin.config.environment.systemPackages
              )
          '

      - name: Build CUDA llama.cpp service package
        if: ${{ inputs.llama_cpp }}
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              configs = api.libs.evalLib.mkNixosConfigurations { inherit (api) fleet; };
            in
              configs.odin.config.services.llama-cpp.package
          '

      - name: Build entire Odin NixOS system
        if: ${{ inputs.entire_host }}
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              configs = api.libs.evalLib.mkNixosConfigurations { inherit (api) fleet; };
            in
              configs.odin.config.system.build.toplevel
          '
