name: Plain Nix migration checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  plain-nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command
            max-jobs = auto
            cores = 0

      - name: Evaluate plain fleet checks
        run: bin/check

      - name: Evaluate fleet unit tests
        run: nix-instantiate --eval --strict --json tests/fleet.nix

      - name: Build plain CI derivation
        run: nix-build ci.nix -A plain-eval

      - name: Check deploy planning
        run: |
          bin/deploy --plan --on @server
          bin/deploy --plan --on @darwin

      - name: Evaluate Colmena hive shape
        run: |
          nix-instantiate --eval --strict --json hive.nix -A odin.networking.hostName
          nix-instantiate --eval --strict --json hive.nix -A huginn.deployment.targetHost
