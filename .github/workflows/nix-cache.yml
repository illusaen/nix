name: Build Nix packages and push to Cachix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        extra-experimental-features = pipe-operators

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-experimental-features = pipe-operators
            accept-flake-config = true
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v16
        with:
          name: illusaen
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # Optional: build specific packages exposed by your flake.
      - name: Build bambu-studio package
        run: |
          nix --extra-experimental-features pipe-operators build .#legacyPackages.x86_64-linux.bambu-studio

      - name: Build llama-cpp package
        run: |
          nix --extra-experimental-features pipe-operators build .#legacyPackages.x86_64-linux.llama-cpp

      - name: Build noctalia package
        run: |
          nix --extra-experimental-features pipe-operators build .#legacyPackages.x86_64-linux.noctalia

      - name: Build NixOS configuration
        run: |
          nix --extra-experimental-features pipe-operators build .#nixosConfigurations.odin.config.system.build.toplevel
