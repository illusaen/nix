name: Build Nix packages and push to Cachix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - architecture
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v16
        with:
          name: illusaen
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build bambu-studio
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              pkgs = import api.sources.nixpkgs.outPath {
                system = "x86_64-linux";
                config.allowUnfree = true;
                overlays = [ api.overlays ];
              };
            in
              pkgs.bambu-studio

      - name: Build CUDA llama-cpp service package
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              configs = api.evalLib.mkNixosConfigurations { inherit (api) fleet; };
            in
              configs.odin.config.services.llama-cpp.package
          '

      - name: Build plain NixOS configuration
        run: |
          nix-build --expr '
            let
              api = import ./default.nix;
              configs = api.evalLib.mkNixosConfigurations { inherit (api) fleet; };
            in
              configs.odin.config.system.build.toplevel
          '
